<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender - POC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #score {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #fff;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #lives {
            position: absolute;
            top: 20px;
            left: 40px;
            color: #fff;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: 48px;
            text-align: center;
            display: none;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #restart-button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 20px;
            background: #ff0000;
            color: white;
            border: 2px solid #fff;
            cursor: pointer;
            pointer-events: auto;
            font-family: 'Courier New', monospace;
        }

        #restart-button:hover {
            background: #cc0000;
        }

        #boss-health-container {
            position: absolute;
            top: 55px;
            left: 40px;
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 5px;
            display: none;
            overflow: hidden;
        }

        #boss-health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff4444);
            transition: width 0.2s ease-out;
        }

        #boss-health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        #you-win {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-size: 48px;
            text-align: center;
            display: none;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #you-win .win-score {
            font-size: 24px;
            color: #ffff00;
            margin-top: 10px;
        }

        #restart-button-win {
            margin-top: 25px;
            padding: 15px 40px;
            font-size: 22px;
            background: linear-gradient(180deg, #00cc00, #009900);
            color: white;
            border: 3px solid #00ff00;
            border-radius: 10px;
            cursor: pointer;
            pointer-events: auto;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            transition: all 0.2s ease;
        }

        #restart-button-win:hover {
            background: linear-gradient(180deg, #00ff00, #00cc00);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
            transform: scale(1.05);
        }

        #restart-button-win:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <canvas id="renderCanvas"></canvas>

    <div id="ui-overlay">
        <div id="lives">LIVES: <span id="lives-count">3</span></div>
        <div id="score">SCORE: <span id="score-count">0</span></div>

        <div id="boss-health-container">
            <div id="boss-health-bar"></div>
            <div id="boss-health-text">BOSS: 100%</div>
        </div>

        <div id="game-over">
            <div>GAME OVER</div>
            <button id="restart-button">RESTART</button>
        </div>

        <div id="you-win">
            <div>🎉 YOU WIN! 🎉</div>
            <div class="win-score">FINAL SCORE: <span id="final-score">0</span></div>
            <button id="restart-button-win">PLAY AGAIN</button>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
