<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender - POC</title>
    <!-- Favicon embebido para evitar 404 en /favicon.ico -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpolygon points='32,4 40,24 60,24 44,36 50,56 32,44 14,56 20,36 4,24 24,24' fill='%23ffffff'/%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        #score {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #fff;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #lives {
            position: absolute;
            top: 20px;
            left: 40px;
            color: #fff;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: 48px;
            text-align: center;
            display: none;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #restart-button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 20px;
            background: #ff0000;
            color: white;
            border: 2px solid #fff;
            cursor: pointer;
            pointer-events: auto;
            font-family: 'Courier New', monospace;
        }

        #restart-button:hover {
            background: #cc0000;
        }

        #boss-health-container {
            position: absolute;
            top: 55px;
            left: 40px;
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 5px;
            display: none;
            overflow: hidden;
        }

        #boss-health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff4444);
            transition: width 0.2s ease-out;
        }

        #boss-health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        #you-win {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-size: 48px;
            text-align: center;
            display: none;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #you-win .win-score {
            font-size: 24px;
            color: #ffff00;
            margin-top: 10px;
        }

        #restart-button-win {
            margin-top: 25px;
            padding: 15px 40px;
            font-size: 22px;
            background: linear-gradient(180deg, #00cc00, #009900);
            color: white;
            border: 3px solid #00ff00;
            border-radius: 10px;
            cursor: pointer;
            pointer-events: auto;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            transition: all 0.2s ease;
        }

        #restart-button-win:hover {
            background: linear-gradient(180deg, #00ff00, #00cc00);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
            transform: scale(1.05);
        }

        #restart-button-win:active {
            transform: scale(0.95);
        }

        /* Menú principal */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #222 0, #000 60%);
            color: #fff;
            z-index: 20;
            text-align: center;
        }

        #main-menu h1 {
            font-size: 48px;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }

        .menu-button {
            margin: 10px 0;
            padding: 12px 40px;
            font-size: 22px;
            background: #111;
            color: #0ff;
            border: 2px solid #0ff;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.2s ease;
        }

        .menu-button:hover {
            background: #0ff;
            color: #000;
        }

        /* Panel de scores */
        #scores-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            z-index: 25;
            text-align: center;
        }

        #scores-panel h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        #scores-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            max-height: 50vh;
            overflow-y: auto;
        }

        #scores-list li {
            margin: 4px 0;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <canvas id="renderCanvas"></canvas>

    <div id="main-menu">
        <h1>SPACE DEFENDER</h1>
        <button id="menu-start" class="menu-button">INICIAR JUEGO</button>
        <button id="menu-scores" class="menu-button">VER SCORES</button>
    </div>

    <div id="scores-panel">
        <h2>Scores</h2>
        <ul id="scores-list"></ul>
        <button id="scores-back" class="menu-button">VOLVER AL MENÚ</button>
    </div>

    <div id="ui-overlay">
        <div id="lives">LIVES: <span id="lives-count">3</span></div>
        <div id="score">SCORE: <span id="score-count">0</span></div>

        <div id="boss-health-container">
            <div id="boss-health-bar"></div>
            <div id="boss-health-text">BOSS: 100%</div>
        </div>

        <div id="game-over">
            <div>GAME OVER</div>
            <button id="restart-button">RESTART</button>
            <button id="menu-button" style="margin-left: 10px; padding: 10px 30px; font-size: 20px; background: #333; color: #fff; border: 2px solid #fff; cursor: pointer; pointer-events: auto; font-family: 'Courier New', monospace;">MENU</button>
        </div>

        <div id="you-win">
            <div>🎉 YOU WIN! 🎉</div>
            <div class="win-score">FINAL SCORE: <span id="final-score">0</span></div>
            <button id="restart-button-win">PLAY AGAIN</button>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
